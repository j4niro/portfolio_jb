<section id="education" class="section">
  <div appReveal>
    <span class="section-tag">Formation</span>
    <h2 class="section-title">Mon parcours académique</h2>
    <p class="section-subtitle">Un double diplôme mêlant ingénierie généraliste et systèmes d'information.</p>
  </div>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let item of education; let i = index" appReveal [revealDelay]="i * 100">
      <div class="timeline-marker">
        <span class="timeline-dot"></span>
        <span class="timeline-line" *ngIf="i < education.length - 1"></span>
      </div>

      <div class="timeline-card card">
        <span class="timeline-period">{{ item.period }}</span>
        <h3 class="timeline-degree">{{ item.degree }}</h3>
        <p class="timeline-school">{{ item.school }} · {{ item.location }}</p>

        <ul class="timeline-details" *ngIf="item.details?.length">
          <li *ngFor="let detail of item.details">{{ detail }}</li>
        </ul>
      </div>
    </div>
  </div>
</section>
